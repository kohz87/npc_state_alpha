name: One-shot 0.1.3 metadata alignment

on:
  push:
    branches:
      - fix/scoped-manual-audit-pending

permissions:
  contents: write

jobs:
  align:
    if: github.event.head_commit.message != 'chore: align release metadata for 0.1.3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/scoped-manual-audit-pending
          fetch-depth: 0
      - name: Align version-owned metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          validate = Path('scripts/validate.js')
          text = validate.read_text(encoding='utf-8')
          if text.count('0.1.2') != 8:
              raise SystemExit(f"Expected exactly 8 release pins in scripts/validate.js, found {text.count('0.1.2')}")
          validate.write_text(text.replace('0.1.2', '0.1.3'), encoding='utf-8')

          dev = Path('DEVELOPMENT.md')
          text = dev.read_text(encoding='utf-8')
          old_version = "* **Package Version:** `0.1.2` declared in `package.json` (ES Module, Node >= 22.0.0, zero external runtime dependencies)."
          new_version = "* **Package Version:** `0.1.3` declared in `package.json` (ES Module, Node >= 22.0.0, zero external runtime dependencies)."
          old_archive = "  * `npm run package` — Executes `node scripts/package.js`, creating the browser runtime distribution in `dist/` plus deterministic `release/npc_state_alpha-0.1.2.zip` and SHA-256 sidecar without dev/test/doc/private files."
          new_archive = "  * `npm run package` — Executes `node scripts/package.js`, creating the browser runtime distribution in `dist/` plus deterministic `release/npc_state_alpha-0.1.3.zip` and SHA-256 sidecar without dev/test/doc/private files."
          if text.count(old_version) != 1 or text.count(old_archive) != 1:
              raise SystemExit('DEVELOPMENT.md current release metadata did not match the expected 0.1.2 baseline exactly.')
          text = text.replace(old_version, new_version, 1).replace(old_archive, new_archive, 1)
          dev.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Commit alignment
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/validate.js DEVELOPMENT.md
          git commit -m 'chore: align release metadata for 0.1.3'
          git push origin HEAD:fix/scoped-manual-audit-pending
